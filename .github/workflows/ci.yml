name: Skill checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/family_briefing.py validate-library
      - run: python scripts/skill_library.py validate
      - run: python scripts/skill_library.py render --check
      - run: python -m unittest discover -s tests -v
      - name: Render fictional demo
        run: >-
          python scripts/family_briefing.py build --synthetic
          --household examples/fictional-household.json
          --calendar examples/fictional-calendar.json
          --start 2026-11-23 --out /tmp/fictional-briefing.md
